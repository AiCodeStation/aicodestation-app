ShortDescription: Secure AI coding workspace with a pre-execution security gate on every run.
Description: |-
  AiCodeStation is a desktop AI command station for controlled software-building workflows.
  It brings every developer tool you own into one workspace, then puts a pre-execution
  security gate, a scanning engine, and a tamper-evident audit trail in front of all of it.

  The application runs locally. The bundled scanners run on your machine, and you choose
  which AI provider it talks to.

  Capabilities include a command blacklist, input sanitization, role and corporate gates,
  zero-trust egress checks, SAST, SCA, SBOM generation, secret detection, IaC and container
  configuration posture, YARA and IOC matching, license compliance, governed workflows with
  approval gates, passkey sign-in, an OS-backed secret vault with external secret manager
  support, and an append-only audit chain with SIEM export.
